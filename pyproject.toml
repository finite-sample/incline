[project]
name = "incline"
version = "1.0.0"
description = "Estimate Trend at a Particular Point in a Noisy Time Series"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Suriyan Laohaprapanon", email = "suriyant@gmail.com" },
    { name = "Gaurav Sood", email = "gsood07@gmail.com" },
]
requires-python = ">=3.12"
keywords = ["time-series", "derivative", "slope", "trend", "savitzky-golay", "spline"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.25.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
]

[project.urls]
Homepage = "https://github.com/finite-sample/incline"
Documentation = "https://finite-sample.github.io/incline/"
Repository = "https://github.com/finite-sample/incline"
Issues = "https://github.com/finite-sample/incline/issues"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pyright>=1.1.390",
    "pydoclint>=0.5",
    "pre-commit>=4",
    { include-group = "test" },
]
test = [
    # The Monte Carlo machinery, extracted from this package's own tests.
    "simcheck @ git+https://github.com/finite-sample/simcheck",
    "pytest>=8",
    "pytest-cov>=6",
]
docs = [
    "sphinx>=8",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
    # docs/examples_executable/ pages run their code at build time.
    "jupyter-sphinx>=0.5.0",
    "ipykernel>=6.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
# The example notebook is a demo, not library code.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Unused fixture arguments and private-member access are how tests are written.
# T20: the Monte Carlo tests print coverage/standard-error diagnostics under
# capsys.disabled(); monte-carlo.yml runs with -rA precisely to capture them.
"tests/**" = ["S101", "D", "ARG", "SLF", "T20"]
"docs/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The deep Monte Carlo tier takes ~45 minutes; monte-carlo.yml opts back in
# with an explicit `-m slow`, which overrides this default.
addopts = "-m 'not slow'"
markers = [
    "slow: Monte Carlo calibration; run with -m slow or deselect with -m 'not slow'",
]

[tool.coverage.run]
source = ["src"]

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.preen]
