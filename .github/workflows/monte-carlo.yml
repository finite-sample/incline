name: monte-carlo

# The deep Monte Carlo tier -- 400 replicates rather than 100 -- is where the
# unbiasedness, coverage, size and power gates have enough precision to mean
# something. `ci.yml` deselects it with `-m "not slow"` and a comment saying it
# "runs on a schedule". This is that schedule; until this file existed there was
# no workflow with a `schedule:` trigger anywhere in the repository, so the deep
# tier ran nowhere at all.
#
# Why that matters: at 100 replicates the three-sigma binomial band around a
# nominal 95% coverage is roughly [0.885, 1.0], which passes an estimator whose
# true coverage is 89%. The 400-replicate tier is what closes that gap, and it
# was dark.
#
# Known issue, deliberately not papered over: on its first-ever execution this
# tier reported one failure in
# `test_bayesian_calibration.py::test_a_wrong_length_scale_breaks_gp_calibration[deep]`,
# on a heavily loaded machine, and passed on a clean re-run of the identical
# command. Measured in isolation that assertion holds by roughly 106 Monte Carlo
# standard errors, so a marginal threshold does not explain it. The cause is
# unknown. `--tb=long -rA` below exists so the next occurrence is diagnosable
# rather than a summary line.

on:
  # Every study is seeded -- `_statistics.py` fixes seed=4, the bootstrap
  # studies use default_rng(seed0 + i) -- so this tier is deterministic. The
  # same code against the same dependencies produces the same numbers, and a
  # red run means something actually changed rather than that the dice came up
  # differently. That is what makes the two triggers below worth having.

  # Dependency drift is the one thing that moves a deterministic result without
  # a commit: `uv sync` resolves the latest numpy/scipy/statsmodels. Weekly,
  # because drift is slow and a daily run is 45 minutes to re-learn the same
  # answer.
  schedule:
    - cron: "0 4 * * 1"

  # On pull requests the tier costs about 45 minutes, so it is opt-in: add the
  # `deep-tier` label to a pull request that could move calibration. Anything
  # touching the uncertainty machinery, the noise models or a smoother's
  # operator deserves it; a docs change or a typo fix does not.
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, labeled]

  workflow_dispatch:
    inputs:
      replicates:
        description: "Replicates per Monte Carlo study (INCLINE_MC_REPS)"
        required: false
        default: "400"

jobs:
  deep-tier:
    runs-on: ubuntu-latest
    # Skipped rather than absent on an unlabeled pull request, so the check is
    # visibly not-run instead of silently missing.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'deep-tier')
    # 26 minutes locally, 43 on a shared runner for 44 tests -- which left
    # 2.5 minutes under the old 45-minute cap, and the 9 bootstrap studies
    # added in c9b6e94 spent it: the first run at 53 tests was killed at
    # 45m15s mid-pytest. Sized for roughly double the current tier so adding
    # a study does not silently turn this red again.
    timeout-minutes: 90

    env:
      INCLINE_MC_REPS: ${{ github.event.inputs.replicates || '400' }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group test

      - name: Run the deep Monte Carlo tier
        # -rA and --tb=long so a failure arrives with its assertion message and
        # the printed coverage/standard-error diagnostics attached. The tier's
        # own tests print those under `capsys.disabled()`, which is only useful
        # if the output is captured.
        run: uv run pytest -m slow -v -rA --tb=long --no-header
