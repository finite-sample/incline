name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Upload the default-branch build to PyPI. Use only to recover a tag
          release whose publication failed after its GitHub release was created.
        type: boolean
        default: false

permissions:
  contents: read

# A manual run and a tag push can otherwise race for the same ref: two builds,
# and two `dist` artifacts uploaded under one name.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and create release
    uses: gojiplus/py-canon/.github/workflows/reusable-release.yml@v1
    permissions:
      contents: write # Create the GitHub release for the pushed tag.
      id-token: write # Authenticate provenance attestation.
    with:
      # `gh release create` fails when the release already exists, so create it
      # only on the original tag push — not on a manual re-run of a released tag.
      github-release: ${{ github.event_name == 'push' }}

  publish:
    name: Publish to PyPI
    needs: release
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.publish &&
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write # Authenticate to PyPI through trusted publishing.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish (trusted publishing, PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          skip-existing: true
