name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly: surface ecosystem drift on quiet repos

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: gojiplus/py-canon/.github/workflows/reusable-ci.yml@v1
    with:
      wheel-import: incline
      # The canon default floor of 3.11 is below requires-python (>=3.12).
      python-versions: '["3.12", "3.14"]'
      # Fast tier measured 92% on adoption; the floor leaves modest headroom.
      coverage-floor: 90
      run-preen: true
